name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: web
        run: |
          npm ci
          npm ci --prefix electron

      - name: Build backend (PyInstaller)
        shell: bash
        run: |
          perl -pi -e 's/\r$//' backend/scripts/build-desktop.sh
          bash -x backend/scripts/build-desktop.sh 2>&1 | tee backend-build.log
          exit ${PIPESTATUS[0]}

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Package macOS app
        working-directory: web/electron
        shell: bash
        run: npx electron-builder --mac dmg 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-buildlog
          path: |
            web/electron/build.log
            backend-build.log

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: web/electron/dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: web
        run: |
          npm ci
          npm ci --prefix electron

      - name: Build backend (PyInstaller)
        shell: bash
        run: |
          perl -pi -e 's/\r$//' backend/scripts/build-desktop.sh
          bash -x backend/scripts/build-desktop.sh 2>&1 | tee backend-build.log
          exit ${PIPESTATUS[0]}

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Package Windows app
        working-directory: web/electron
        shell: bash
        run: npx electron-builder --win 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-buildlog
          path: |
            web/electron/build.log
            backend-build.log

      - name: Diagnose failure (debug blackbox)
        if: failure()
        shell: bash
        run: |
          {
            echo "## Windows build debug"
            echo "- uname: $(uname -a)"
            echo "- uv path: $(command -v uv || echo MISSING)"
            echo "- bash: $BASH_VERSION"
            echo "### backend-build.log (tail -60)"
            echo '```'
            tail -60 backend-build.log 2>/dev/null || echo "(no backend-build.log)"
            echo '```'
            echo "### file type check (CRLF?)"
            echo '```'
            file backend/scripts/build-desktop.sh 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::uname=$(uname -a) | uv=$(command -v uv || echo MISSING)"
          echo "::error::FULLLOG $(tail -c 2500 backend-build.log 2>/dev/null | tr '\n' '|')"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: web/electron/dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
          generate_release_notes: true
          body: |
            ### 安装提示
            - **macOS**：首次打开请 **右键 → 打开**（目前为 ad-hoc 签名，Gatekeeper 会拦截普通双击）
            - **Windows**：安装向导可自选安装目录；后端服务在后台静默运行，不会弹出终端窗口
